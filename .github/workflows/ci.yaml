name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated code is not committed, so it is rebuilt here. A generator that
      # fails, or output that no longer compiles, fails the build.
      - name: Generate localisations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run build_runner build

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --fatal-infos

      # TRD §11 and §4: no hardcoded user-facing strings, and layer
      # dependencies point downward only.
      - name: Check conventions
        run: dart run tool/check_conventions.dart

      - name: Test
        run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyse-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      # Debug only. Signed release builds come from Codemagic (TRD §16), which
      # holds the keystore — CI here proves the app compiles, nothing more.
      - name: Build debug APK
        run: flutter build apk --debug

      # TRD §13 budgets the release download at 25 MB. A debug APK is much
      # larger and not comparable, so this reports size for trend visibility
      # rather than enforcing the budget. Enforce it against the release
      # artifact once signing is wired up.
      - name: Report APK size
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          printf 'debug APK: %s\n' "$(du -h "$apk" | cut -f1)"
