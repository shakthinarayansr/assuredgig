# Native launch screen. Regenerate: dart run flutter_native_splash:create
#
# Android 8–11 show the full logo. Android 12+ force the splash into a circular
# icon slot that would clip the wordmark, so they show the mark alone.
flutter_native_splash:
  android: true
  ios: false
  web: false

  color: "#FFFFFF"
  image: assets/branding/logo_full.png
  fullscreen: false

  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
    icon_background_color: "#FFFFFF"
